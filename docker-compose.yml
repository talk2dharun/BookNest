# Host port defaults to 5432. Set POSTGRES_PORT=5433 in the root .env if 5432 is already in use.
# JWT values below are local-dev placeholders. Generate your own for anything beyond this machine.

services:
  db:
    image: postgres:18-alpine
    container_name: booknest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: booknest
      POSTGRES_PASSWORD: booknest
      POSTGRES_DB: booknest
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 image stores data under /var/lib/postgresql (not /var/lib/postgresql/data).
      - booknest_pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booknest -d booknest"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: booknest-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://booknest:booknest@db:5432/booknest
      DATABASE_URL_TEST: postgresql://booknest:booknest@db:5432/booknest_test
      PORT: 4000
      FRONTEND_ORIGIN: http://localhost:3000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-booknest-local-access-secret-change-me-32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-booknest-local-refresh-secret-change-me-32}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      COOKIE_SAMESITE: lax
      COOKIE_SECURE: "false"
      NODE_ENV: production
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    container_name: booknest-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      # Baked in at build time via NEXT_PUBLIC_API_URL. The browser calls this host.
      NEXT_PUBLIC_API_URL: http://localhost:4000

volumes:
  booknest_pgdata:
